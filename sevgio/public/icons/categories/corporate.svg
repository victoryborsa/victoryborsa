<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="corp-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FA39A"/>
      <stop offset="1" stop-color="#1A5F5B"/>
    </linearGradient>
    <linearGradient id="corp-flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CC0B6"/>
      <stop offset="1" stop-color="#2B8A84"/>
    </linearGradient>
    <linearGradient id="corp-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE29A"/>
      <stop offset=".5" stop-color="#F5BE3A"/>
      <stop offset="1" stop-color="#C98410"/>
    </linearGradient>
    <linearGradient id="corp-handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9C5E33"/>
      <stop offset="1" stop-color="#6E3B19"/>
    </linearGradient>
  </defs>
  <ellipse cx="48" cy="85" rx="36" ry="4.5" fill="#1B2B2A" opacity=".14"/>
  <!-- handle -->
  <path d="M36 32 L36 24 a6 6 0 0 1 6 -6 L54 18 a6 6 0 0 1 6 6 L60 32" fill="none" stroke="url(#corp-handle)" stroke-width="6" stroke-linecap="round"/>
  <!-- body -->
  <rect x="12" y="30" width="72" height="50" rx="10" fill="url(#corp-body)"/>
  <!-- flap -->
  <path d="M22 30 L74 30 a10 10 0 0 1 10 10 L84 50 Q48 60 12 50 L12 40 a10 10 0 0 1 10 -10Z" fill="url(#corp-flap)"/>
  <path d="M20 34 L76 34" stroke="#fff" stroke-width="2" opacity=".3" stroke-linecap="round"/>
  <!-- stitching -->
  <path d="M16 72 L80 72" stroke="#fff" stroke-width="1.2" stroke-dasharray="3 3" opacity=".35"/>
  <!-- clasp -->
  <rect x="40" y="48" width="16" height="12" rx="3" fill="url(#corp-gold)"/>
  <rect x="45" y="52" width="6" height="4" rx="1.5" fill="#9A6408"/>
  <!-- corner caps -->
  <path d="M12 72 L12 70 L20 80 L18 80 a6 6 0 0 1 -6 -6Z" fill="url(#corp-gold)"/>
  <path d="M84 72 L84 70 L76 80 L78 80 a6 6 0 0 0 6 -6Z" fill="url(#corp-gold)"/>
</svg>
