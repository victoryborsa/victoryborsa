<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="room-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9955F"/>
      <stop offset="1" stop-color="#93552C"/>
    </linearGradient>
    <linearGradient id="room-blanket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FB3AA"/>
      <stop offset="1" stop-color="#1F6E6A"/>
    </linearGradient>
    <linearGradient id="room-sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E8EA"/>
    </linearGradient>
    <radialGradient id="room-pillow" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE2E5"/>
    </radialGradient>
    <radialGradient id="room-pillow2" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFC2B8"/>
      <stop offset="1" stop-color="#E5584B"/>
    </radialGradient>
  </defs>
  <ellipse cx="48" cy="84" rx="38" ry="4.5" fill="#1B2B2A" opacity=".14"/>
  <!-- headboard -->
  <rect x="10" y="24" width="18" height="56" rx="5" fill="url(#room-wood)"/>
  <rect x="13" y="28" width="12" height="22" rx="3" fill="#E9AF7E" opacity=".6"/>
  <!-- mattress / sheet -->
  <rect x="22" y="50" width="64" height="18" rx="5" fill="url(#room-sheet)"/>
  <!-- blanket -->
  <path d="M44 48 L82 48 a6 6 0 0 1 6 6 L88 66 a4 4 0 0 1 -4 4 L44 70Z" fill="url(#room-blanket)"/>
  <path d="M44 48 L48 48 L48 70 L44 70Z" fill="#F5BE3A"/>
  <path d="M52 52 L84 52" stroke="#fff" stroke-width="1.5" opacity=".3" stroke-linecap="round"/>
  <!-- pillows -->
  <rect x="25" y="38" width="20" height="13" rx="6" fill="url(#room-pillow)"/>
  <rect x="30" y="41" width="16" height="11" rx="5" fill="url(#room-pillow2)"/>
  <!-- frame + legs -->
  <rect x="22" y="68" width="66" height="7" rx="3" fill="url(#room-wood)"/>
  <rect x="82" y="72" width="5" height="10" rx="2" fill="#7A4421"/>
  <rect x="12" y="76" width="5" height="6" rx="2" fill="#7A4421"/>
</svg>
