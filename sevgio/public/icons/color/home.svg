<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="home-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FB3AA"/>
      <stop offset="1" stop-color="#1F6E6A"/>
    </linearGradient>
    <linearGradient id="home-wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#EADFCB"/>
    </linearGradient>
    <linearGradient id="home-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3D5BC"/>
      <stop offset="1" stop-color="#CDBB9C"/>
    </linearGradient>
    <linearGradient id="home-door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9955F"/>
      <stop offset="1" stop-color="#9C5E33"/>
    </linearGradient>
    <radialGradient id="home-bush" cx="40%" cy="30%" r="70%">
      <stop offset="0" stop-color="#A8DB7E"/>
      <stop offset="1" stop-color="#4E9A3C"/>
    </radialGradient>
  </defs>
  <ellipse cx="48" cy="85" rx="34" ry="5" fill="#1B2B2A" opacity=".14"/>
  <!-- chimney -->
  <rect x="62" y="20" width="8" height="16" rx="1.5" fill="#B9644F"/>
  <rect x="60.5" y="18" width="11" height="4" rx="1.5" fill="#D9806A"/>
  <!-- side wall -->
  <path d="M70 46 L82 40 L82 76 L70 82Z" fill="url(#home-side)"/>
  <!-- front wall -->
  <path d="M20 46 L48 26 L70 46 L70 82 L20 82Z" fill="url(#home-wall)"/>
  <!-- roof -->
  <path d="M12 50 L48 20 L74 44 L70 49 L48 30 L17 55Z" fill="url(#home-roof)"/>
  <path d="M48 20 L60 13 L86 38 L74 44Z" fill="#2B8A84"/>
  <path d="M14 49 L48 21 L52 24 L17 53Z" fill="#fff" opacity=".25"/>
  <!-- heart window -->
  <circle cx="45" cy="48" r="8.5" fill="#CFE9F2" stroke="#fff" stroke-width="2"/>
  <path d="M45 53 C39 49 40 44.5 42.6 44.2 C44 44 44.8 45 45 45.8 C45.2 45 46 44 47.4 44.2 C50 44.5 51 49 45 53Z" fill="#EF6B5B"/>
  <!-- door -->
  <path d="M38 82 L38 66 a7 7 0 0 1 14 0 L52 82Z" fill="url(#home-door)"/>
  <circle cx="49" cy="74" r="1.3" fill="#F5D27A"/>
  <!-- bush -->
  <circle cx="20" cy="78" r="8" fill="url(#home-bush)"/>
  <circle cx="28" cy="80" r="6" fill="url(#home-bush)"/>
  <circle cx="72" cy="80" r="5.5" fill="url(#home-bush)"/>
</svg>
