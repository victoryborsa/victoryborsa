<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="mon-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F68A7C"/>
      <stop offset="1" stop-color="#D84B3E"/>
    </linearGradient>
    <linearGradient id="mon-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEFF1"/>
    </linearGradient>
    <linearGradient id="mon-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9AA5AB"/>
      <stop offset=".5" stop-color="#F4F6F7"/>
      <stop offset="1" stop-color="#7F8B91"/>
    </linearGradient>
  </defs>
  <ellipse cx="48" cy="86" rx="32" ry="4.5" fill="#1B2B2A" opacity=".14"/>
