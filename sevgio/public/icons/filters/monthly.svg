  <path d="M24 20 L70 20 a9 9 0 0 1 9 9 L79 36 L15 36 L15 29 a9 9 0 0 1 9 -9Z" fill="url(#mon-top)"/>
  <rect x="15" y="34" width="64" height="2" fill="#B23A2F" opacity=".35"/>
  <!-- rings -->
