  <rect x="60" y="13" width="6" height="15" rx="3" fill="url(#mon-ring)"/>
  <!-- date grid -->
  <g fill="#C7D0D4">
    <rect x="22" y="43" width="8" height="7" rx="2"/><rect x="34" y="43" width="8" height="7" rx="2"/><rect x="46" y="43" width="8" height="7" rx="2"/><rect x="58" y="43" width="8" height="7" rx="2"/>
    <rect x="22" y="55" width="8" height="7" rx="2"/><rect x="34" y="55" width="8" height="7" rx="2"/><rect x="58" y="55" width="8" height="7" rx="2"/>
    <rect x="22" y="67" width="8" height="7" rx="2"/><rect x="34" y="67" width="8" height="7" rx="2"/><rect x="46" y="67" width="8" height="7" rx="2"/>
  </g>
  <rect x="45" y="54" width="10" height="9" rx="2.5" fill="#F5BE3A"/>
