# One-click deploy on Render.com (Blueprint). Fill in the env vars in the Render dashboard.
services:
  - type: web
    name: shinepro-backoffice
    runtime: node
    plan: starter
    rootDir: shinepro-backoffice
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_FILE
        value: /var/data/shinepro.db
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ALERT_EMAILS
        sync: false
      - key: ALERT_PHONES
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
