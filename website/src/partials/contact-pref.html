<fieldset class="field full"><legend>Best way to reach you *</legend>
  <div class="segmented" style="grid-template-columns:1fr 1fr">
    <label><input type="radio" name="preferred_contact" value="phone" checked /><span>Phone or text</span></label>
    <label><input type="radio" name="preferred_contact" value="email" /><span>Email</span></label>
  </div>
</fieldset>
<div class="field"><label for="cp-phone">Phone <span data-req>*</span></label><input class="input" id="cp-phone" name="Phone" type="tel" autocomplete="tel" data-contact="phone" /><span class="field-error">Please enter a 10-digit phone number.</span></div>
<div class="field"><label for="cp-email">Email <span data-req><span class="opt">(optional)</span></span></label><input class="input" id="cp-email" name="Email" type="email" autocomplete="email" data-contact="email" /><span class="field-error">Please enter a valid email.</span></div>
