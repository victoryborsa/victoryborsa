<!-- 2) THE WEBSITE'S FORMS POST HERE. Prices come only from public/pricing.js (the website build
        copies that file). The back office prices every estimate again itself and ignores any
        price the browser sends. Full field lists and responses: DEVELOPER_HANDOFF.md.
        Make one request_id per form fill and reuse it if the visitor presses submit again. -->
<script>
  function shineRequestId() {
    return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r-' + Date.now().toString(36) + Math.random().toString(36).slice(2);
  }
  function sendToShinePro(path, body) {
    return fetch('https://admin.pghshinepro.com' + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error); return d; }); });
  }
  // Free estimate form:
  // sendToShinePro('/api/leads', { name, email, phone, preferred_contact: 'phone' | 'email' | 'text',
  //   service_type: 'deep', bedrooms: '2', frequency: 'once', addons: ['fridge'], organizing_hours: 2,
  //   address, zip, preferred_date, preferred_time, referred_by, gift_code, message,
  //   marketing_opt_in: false, request_id, company_website: '' })
  //   -> { ok, id, lead_id, duplicate, estimated_price, quote, breakdown }
  // Contact:    sendToShinePro('/api/contact', { name, email, phone, preferred_contact, interest, message, marketing_opt_in, request_id, company_website })
  // Newsletter: sendToShinePro('/api/newsletter', { email, consent: true, request_id, company_website })
  // Other forms: sendToShinePro('/api/forms', { form: 'Careers', name, email, phone, preferred_contact, fields: { 'Position': 'Cleaner' }, request_id, company_website })
</script>
