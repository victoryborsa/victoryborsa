        <h3 style="margin-bottom:12px">Latest issues</h3>${issuesTable(S.issues.slice(0, 3))}`;
    } else if (tab === "users") {
      content = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Listings</th><th>Role</th></tr></thead><tbody>
        ${S.users.map(u => `<tr><td><strong>${esc(u.name)}</strong></td><td>${esc(u.email)}</td><td>${fmtShort(u.joined)} ${u.joined.slice(0, 4)}</td><td class="num">${S.props.filter(p => p.host === u.id).length || "—"}</td><td>${u.id === S.user.id ? `<span class="pill neutral">Admin (you)</span>` : `<select id="role-${u.id}" data-role="${u.id}" aria-label="Role for ${esc(u.name)}">${["customer","host","admin"].map(r => `<option value="${r}" ${u.role === r ? "selected" : ""}>${r[0].toUpperCase() + r.slice(1)}</option>`).join("")}</select>`}</td></tr>`).join("")}</tbody></table></div>
        <p class="hint" style="margin-top:10px">Role changes take effect at the user's next page load and are recorded in the audit log. You can't change your own role.</p>`;
    } else if (tab === "properties") {
      content = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Listing</th><th>Host</th><th class="num">Price</th><th>Mode</th><th class="num">Rating</th><th>Status</th><th></th></tr></thead><tbody>
        ${S.props.map(p => `<tr><td><strong>${esc(p.name)}</strong><div class="muted" style="font-size:13px">${esc(p.city)}</div></td><td><select id="ph-${p.id}" data-phost="${p.id}" aria-label="Host for ${esc(p.name)}">${S.users.filter(u => u.role === "host").map(u => `<option value="${u.id}" ${p.host === u.id ? "selected" : ""}>${esc(u.name)}</option>`).join("")}</select></td><td class="num">${money(p.price)}</td><td>${p.instant ? "Instant" : "Request"}</td><td class="num">${p.rating ? p.rating.toFixed(2) : "—"}</td><td>${p.active ? `<span class="pill ok">Live</span>` : `<span class="pill neutral">Hidden</span>`}</td><td><div class="row" style="flex-wrap:nowrap;gap:6px"><button class="btn btn-ghost btn-sm" data-toggle="${p.id}">${p.active ? "Hide" : "Publish"}</button><button class="btn btn-ghost btn-sm" data-open="${p.id}">View</button></div></td></tr>`).join("")}</tbody></table></div>`;
    } else if (tab === "reservations") {
      const all = S.reservations.filter(r => r.status !== "hold").sort((a, b) => a.ci < b.ci ? 1 : -1);
      content = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Reference</th><th>Listing</th><th>Guest</th><th>Dates</th><th class="num">Total</th><th>Status</th><th></th></tr></thead><tbody>
        ${all.map(r => `<tr><td class="mono">${r.code}</td><td>${esc(prop(r.propId).name)}</td><td>${esc(user(r.guestId).name)}<div class="muted" style="font-size:13px">${esc(user(r.guestId).email)}</div></td><td>${fmtShort(r.ci)} – ${fmtShort(r.co)}</td><td class="num">${money(r.total)}</td><td>${statusPill(r.status)}</td><td>${r.status === "confirmed" || r.status === "pending" ? `<button class="btn btn-danger btn-sm" data-cancel="${r.code}">Cancel</button>` : ""}</td></tr>`).join("")}</tbody></table></div>`;
    } else if (tab === "issues") {
      content = `<p class="muted" style="margin-bottom:12px">Every failed payment, sync problem and refused booking is logged here with enough detail to follow up.</p>${issuesTable(S.issues)}`;
    } else {
      const st = S.settings;
      content = `<form class="box" id="settings-form" style="max-width:560px" novalidate><h3>Fees and checkout</h3>
        <div class="grid-2"><label class="field"><span>Booking fee (%)</span><input class="input mono" id="st-fee" type="number" min="0" max="30" step="0.5" value="${st.feePct}"></label><label class="field"><span>Tax (%)</span><input class="input mono" id="st-tax" type="number" min="0" max="40" step="0.5" value="${st.taxPct}"></label></div>
        <label class="field"><span>Checkout hold (minutes)</span><input class="input mono" id="st-hold" type="number" min="5" max="60" value="${st.holdMin}"><span class="hint">How long dates stay reserved while a guest completes payment.</span></label>
        <div class="err-text" id="st-err" hidden></div><div><button class="btn btn-primary" type="submit">Save settings</button></div></form>`;
    }
    return `<div class="wrap" style="padding-bottom:56px"><div class="dash-head"><div><p class="eyebrow">Admin</p><h1 style="font-size:clamp(26px,4vw,36px)">Sevgio operations</h1></div></div>
      <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-tab="admin:${k}" aria-selected="${tab === k}">${l}</button>`).join("")}</div>${content}</div>`;
  }
  function issuesTable(list) {
    const sev = { error: ["danger", "Error"], warn: ["warn", "Warning"], info: ["neutral", "Info"] };
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>When</th><th>Severity</th><th>Area</th><th>What happened</th><th>Related to</th><th>Status</th></tr></thead><tbody>
      ${list.map((i, k) => `<tr><td class="mono" style="white-space:nowrap">${esc(i.at)}</td><td><span class="pill ${sev[i.sev][0]}">${sev[i.sev][1]}</span></td><td>${esc(i.area)}</td><td>${esc(i.msg)}</td><td>${esc(i.ref)}</td><td>${i.status === "Open" ? `<button class="btn btn-ghost btn-sm" data-resolve="${S.issues.indexOf(i)}">Mark resolved</button>` : `<span class="muted">${esc(i.status)}</span>`}</td></tr>`).join("")}</tbody></table></div>`;
  }

  // ---------- Events ----------
  function showErr(id, msg) { const el = document.getElementById(id); if (!el) return; el.hidden = !msg; el.textContent = msg || ""; }
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
  const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  function logIssue(sev, area, msg, ref, status) { const d = new Date(); S.issues.unshift({ at: iso(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()), sev, area, msg, ref, status: status || "Open" }); }
  function newCode() { return "SV-" + (48700 + S.reservations.length * 7 + Math.floor(Math.random() * 6)); }

  function openGallery(p, i) {
    const m = document.createElement("div");
    m.className = "modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true"); m.setAttribute("aria-label", "Photos of " + p.name);
    const draw = () => { m.innerHTML = `<div class="bar"><strong style="flex:1">${GLABEL[GALLERY[i]]} · ${i + 1} / ${GALLERY.length}</strong><button class="btn btn-ghost btn-sm" data-m="close">Close</button></div><div class="stage"><div class="frame">${scene(p, GALLERY[i])}</div></div><div class="row" style="justify-content:center"><button class="btn btn-ghost" data-m="prev">‹ Previous</button><button class="btn btn-ghost" data-m="next">Next ›</button></div>`; };
    const close = () => { m.remove(); document.removeEventListener("keydown", key); };
    const key = e => { if (e.key === "Escape") close(); if (e.key === "ArrowRight") { i = (i + 1) % GALLERY.length; draw(); } if (e.key === "ArrowLeft") { i = (i + GALLERY.length - 1) % GALLERY.length; draw(); } };
    m.addEventListener("click", e => { const a = e.target.closest("[data-m]"); if (e.target === m) return close(); if (!a) return; if (a.dataset.m === "close") close(); if (a.dataset.m === "next") { i = (i + 1) % GALLERY.length; draw(); } if (a.dataset.m === "prev") { i = (i + GALLERY.length - 1) % GALLERY.length; draw(); } });
    document.addEventListener("keydown", key); draw(); document.body.appendChild(m); m.querySelector("[data-m=close]").focus();
  }

  let holdTimer = null;
  function bind() {
    clearInterval(holdTimer);
    if (S.view === "checkout" && S.checkout) holdTimer = setInterval(() => {
      const el = document.getElementById("hold-left"); if (!el) return;
      const left = S.checkout.holdUntil - Date.now();
      if (left <= 0) { releaseHold(); render(); return; }
      el.textContent = pad(Math.floor(left / 60000)) + ":" + pad(Math.floor(left % 60000 / 1000));
    }, 1000);

    const sf = document.getElementById("search-form");
    if (sf) {
      sf.addEventListener("submit", e => {
        e.preventDefault();
        const ci = val("s-ci"), co = val("s-co");
        if ((ci && !co) || (!ci && co)) return showErr("s-err", "Add both a check-in and a check-out date, or leave both empty.");
        if (ci && co && co <= ci) return showErr("s-err", "Check-out must be after check-in.");
        if (ci && ci < TODAY) return showErr("s-err", "Check-in can't be in the past.");
        Object.assign(S.search, { loc: val("s-loc"), ci, co });
        if (ci && co) Object.assign(S.sel, { ci, co, guests: S.search.guests });
        go("search");
      });
      const ciEl = document.getElementById("s-ci");
      ciEl.addEventListener("change", () => { const co = document.getElementById("s-co"); co.min = ciEl.value ? addDays(ciEl.value, 1) : addDays(TODAY, 1); if (ciEl.value && (!co.value || co.value <= ciEl.value)) co.value = addDays(ciEl.value, 3); });
    }
    const sort = document.getElementById("sort"); if (sort) sort.addEventListener("change", () => { S.sort = sort.value; render(); });
    const fp = document.getElementById("f-price"); if (fp) { fp.addEventListener("input", () => { document.getElementById("f-price-v").textContent = +fp.value >= 450 ? "Any price" : "Up to " + money(+fp.value); }); fp.addEventListener("change", () => { S.filters.price = +fp.value >= 450 ? 0 : +fp.value; render(); }); }
    document.querySelectorAll("[data-amen]").forEach(el => el.addEventListener("change", () => { const a = el.dataset.amen, f = S.filters.amen; el.checked ? f.push(a) : f.splice(f.indexOf(a), 1); render(); }));
    const inst = document.getElementById("f-instant"); if (inst) inst.addEventListener("change", () => { S.filters.instantOnly = inst.checked; render(); });
    const asu = document.getElementById("as-user"); asu.addEventListener("change", () => { S.user = asu.value ? user(asu.value) : null; S.editProp = null; const v = S.user ? (S.user.role === "host" ? "host" : S.user.role === "admin" ? "admin" : "account") : "home"; toast(S.user ? "Viewing as " + S.user.name : "Signed out"); go(v); });
    const hcp = document.getElementById("hc-prop"); if (hcp) hcp.addEventListener("change", () => { S.hostCalProp = hcp.value; render(); });
    document.querySelectorAll("[data-role]").forEach(el => el.addEventListener("change", () => { const u = user(el.dataset.role); if (u.role === "host" && el.value !== "host" && S.props.some(p => p.host === u.id)) { el.value = "host"; return toast("Reassign " + u.name.split(" ")[0] + "'s listings to another host first."); } u.role = el.value; logIssue("info", "Access", "Role changed to " + el.value, u.email + " · by " + S.user.email, "Audit log"); toast(u.name + " is now " + (el.value === "admin" ? "an admin" : "a " + el.value)); render(); }));
    document.querySelectorAll("[data-phost]").forEach(el => el.addEventListener("change", () => { prop(el.dataset.phost).host = el.value; toast("Listing reassigned to " + user(el.value).name); render(); }));
    const photo = document.getElementById("e-photo"); if (photo) photo.addEventListener("change", () => { document.getElementById("e-photo-hint").textContent = photo.files.length + " photo" + (photo.files.length === 1 ? "" : "s") + " selected. In the preview they aren't uploaded."; });

    // Forms
    const on = (id, fn) => { const f = document.getElementById(id); if (f) f.addEventListener("submit", e => { e.preventDefault(); fn(); }); };
    on("ask-form", () => { if (!val("ask-name") || !emailOk(val("ask-email"))) return showErr("ask-err", "Add your name and a valid email so the host can reply."); if (val("ask-msg").length < 5) return showErr("ask-err", "Write your question before sending."); toast("Question sent. The host usually replies within a few hours."); document.getElementById("ask-msg").value = ""; showErr("ask-err", ""); });
    on("contact-form", () => { if (!val("ct-name") || !emailOk(val("ct-email"))) return showErr("ct-err", "Add your name and a valid email address."); if (val("ct-msg").length < 5) return showErr("ct-err", "Write a message before sending."); toast("Message sent. We'll reply to " + val("ct-email") + "."); go("home"); });
    on("signin-form", () => {
      const e = val("si-email").toLowerCase(), pw = val("si-pass");
      if (!emailOk(e)) return showErr("si-err", "Enter the email address you signed up with.");
      const u = S.users.find(x => x.email === e);
      if (!u || pw.length < 8) return showErr("si-err", "That email and password don't match. Check for typos, or reset your password.");
      S.user = u; toast("Signed in as " + u.name);
      const next = S.params.next || (u.role === "host" ? "host" : u.role === "admin" ? "admin" : "account");
      go(next === "checkout-resume" ? "checkout" : next);
    });
    on("signup-form", () => {
      const n = val("su-name"), e = val("su-email").toLowerCase(), pw = val("su-pass");
      if (!n) return showErr("su-err", "Add your full name.");
      if (!emailOk(e)) return showErr("su-err", "Enter a valid email address, like name@example.com.");
      if (S.users.some(x => x.email === e)) return showErr("su-err", "An account with this email already exists. Sign in instead, or reset your password.");
      if (pw.length < 8) return showErr("su-err", "Use at least 8 characters for your password.");
      const u = { id: "u" + (S.users.length + 1), name: n, email: e, phone: "", role: "customer", joined: TODAY }; S.users.push(u); S.user = u; toast("Account created. Welcome, " + n.split(" ")[0] + "!"); go("account");
    });
    on("reset-form", () => { const e = val("rs-email"); if (!emailOk(e)) return showErr("rs-err", "Enter a valid email address."); go("reset", { sent: e }); });
    on("profile-form", () => { const e = val("pf-email").toLowerCase(); if (!val("pf-name")) return showErr("pf-err", "Your name can't be empty."); if (!emailOk(e)) return showErr("pf-err", "Enter a valid email address."); if (S.users.some(x => x.email === e && x.id !== S.user.id)) return showErr("pf-err", "Another account already uses this email."); Object.assign(S.user, { name: val("pf-name"), phone: val("pf-phone"), email: e }); toast("Profile saved"); render(); });
    on("details-form", () => {
      const c = S.checkout, u = S.user, p = prop(c.propId);
      const name = val("d-name"), phone = val("d-phone"), email = u ? u.email : val("d-email").toLowerCase();
      if (!name) return showErr("d-err", "Add the name of the lead guest.");
      if (phone.replace(/\D/g, "").length < 7) return showErr("d-err", "Add a phone number the host can reach you on during your stay.");
      if (!u) {
        if (!emailOk(email)) return showErr("d-err", "Enter a valid email address. Your confirmation will be sent there.");
        if (S.users.some(x => x.email === email)) return showErr("d-err", "An account with this email already exists. Sign in to continue.");
        if (val("d-pass").length < 8) return showErr("d-err", "Create a password with at least 8 characters.");
      }
      if (!p.instant && val("d-note").length < 10) return showErr("d-err", "Write a short message to the host. It helps them accept your request.");
      Object.assign(c, { name, phone, email, arrival: val("d-arrival"), note: val("d-note"), pass: !u, step: 1 });
      render();
    });
    on("pay-form", () => {
      const c = S.checkout, p = prop(c.propId), num = val("c-num").replace(/\s/g, "");
      if (!/^\d{16}$/.test(num)) return showErr("c-err", "Card number should be 16 digits.");
      if (!/^\d{2}\s*\/\s*\d{2}$/.test(val("c-exp"))) return showErr("c-err", "Enter the expiry date as MM / YY.");
      if (!/^\d{3,4}$/.test(val("c-cvc"))) return showErr("c-err", "The security code is the 3 or 4 digits on the back of your card.");
      if (!document.getElementById("c-agree").checked) return showErr("c-err", "Tick the box to agree to the house rules and cancellation policy.");
      if (num === "4000000000000002") { logIssue("error", "Payment", "Card declined during checkout", p.name + " · " + c.email); return showErr("c-err", "Your card was declined. You haven't been charged. Try another card, or contact your bank."); }
      // Final availability check: the live site does this inside the database, so two guests can never book the same nights.
      if (!isAvailable(p.id, c.ci, c.co, c.holdCode)) { logIssue("info", "Double booking prevented", "Checkout refused: dates were taken", p.name, "No action needed"); releaseHold(); return showErr("c-err", "Sorry, those dates were just booked by someone else. You haven't been charged."); }
      let u = S.user;
      if (!u) { u = { id: "u" + (S.users.length + 1), name: c.name, email: c.email, phone: c.phone, role: "customer", joined: TODAY }; S.users.push(u); S.user = u; }
      const hold = S.reservations.find(r => r.code === c.holdCode);
      Object.assign(hold, { guestId: u.id, status: p.instant ? "confirmed" : "pending", total: priceFor(p, c.ci, c.co).total, created: TODAY });
      S.checkout = null; S.sel = { ci: "", co: "", guests: 2 };
      go("confirmation", { code: hold.code });
    });
    on("edit-form", () => {
      const p = prop(S.editProp);
      if (!p || p.host !== S.user.id) return showErr("e-err", "You can only edit your own listings.");
      const price = +val("e-price"), clean = +val("e-clean"), min = +val("e-min"), g = +val("e-guests");
      if (!val("e-name")) return showErr("e-err", "The listing needs a title.");
      if (!(price >= 20)) return showErr("e-err", "Nightly price must be at least $20.");
      if (!(clean >= 0)) return showErr("e-err", "Cleaning fee can't be negative.");
      if (!(min >= 1 && min <= 30)) return showErr("e-err", "Minimum nights must be between 1 and 30.");
      if (!(g >= 1 && g <= 20)) return showErr("e-err", "Maximum guests must be between 1 and 20.");
      Object.assign(p, { name: val("e-name"), desc: val("e-desc"), price, cleaning: clean, minNights: min, guests: g, instant: val("e-mode") === "instant", cancel: val("e-cancel"),
        amen: [...document.querySelectorAll("[data-eamen]")].filter(x => x.checked).map(x => x.dataset.eamen), rules: val("e-rules").split("\n").map(s => s.trim()).filter(Boolean) });
      S.editProp = null; toast("Listing saved. Changes are live."); render();
    });
    on("settings-form", () => { const f = +val("st-fee"), t = +val("st-tax"), h = +val("st-hold"); if (!(f >= 0 && f <= 30 && t >= 0 && t <= 40 && h >= 5 && h <= 60)) return showErr("st-err", "Fee must be 0–30%, tax 0–40%, and hold 5–60 minutes."); Object.assign(S.settings, { feePct: f, taxPct: t, holdMin: h }); toast("Settings saved. New prices apply to new bookings."); render(); });
  }

  function releaseHold() {
    const c = S.checkout; if (!c) return;
    const i = S.reservations.findIndex(r => r.code === c.holdCode && r.status === "hold");
    if (i >= 0) S.reservations.splice(i, 1);
    c.holdUntil = 0;
  }
  function startCheckout(p) {
    const s = S.sel;
    if (!isAvailable(p.id, s.ci, s.co)) { S.calMsg = "Those dates are no longer available. Choose different dates."; render(); return; }
    // Place a short hold so no one else can book these nights during checkout.
    const code = newCode();
    S.reservations.push({ code, propId: p.id, guestId: S.user ? S.user.id : null, ci: s.ci, co: s.co, guests: s.guests, status: "hold", total: 0, created: TODAY });
    S.checkout = { propId: p.id, ci: s.ci, co: s.co, guests: s.guests, step: 0, holdCode: code, holdUntil: Date.now() + S.settings.holdMin * 60000 };
    go("checkout");
  }

  root.addEventListener("click", e => {
    const t = e.target.closest("button, [data-go], [data-open]");
    if (!t) return;
    const d = t.dataset;
    if (d.go) { if (d.go === "search" && S.view !== "search") { /* keep current search */ } if (S.view === "checkout" && S.checkout && d.go !== "signin") { releaseHold(); S.checkout = null; } go(d.go, d.go === "signin" && S.view === "checkout" ? { next: "checkout-resume" } : {}); return; }
    if (d.open) {
      if (S.view === "checkout" && S.checkout) { releaseHold(); S.checkout = null; }
      if (S.params.id !== d.open || S.view !== "property") { S.calMonth = null; if (!(S.search.ci && S.search.co)) S.sel = { ci: "", co: "", guests: S.search.guests }; else S.sel = { ci: S.search.ci, co: S.search.co, guests: S.search.guests }; const p = prop(d.open); if (p && S.sel.guests > p.guests) S.sel.guests = p.guests; }
      go("property", { id: d.open }); return;
    }
    if (d.day) {
      const p = prop(S.params.id), s = S.sel, ds = d.day; S.calMsg = "";
      if (!s.ci || s.co || ds <= s.ci) { if (unavailableNights(p.id).has(ds)) { S.calMsg = "That night is already booked. Pick another check-in date."; } else { s.ci = ds; s.co = ""; } }
      else if (!isAvailable(p.id, s.ci, ds)) { S.calMsg = "Your stay can't include nights that are already booked. Pick an earlier check-out date or different dates."; }
      else { s.co = ds; if (nightsBetween(s.ci, s.co) < p.minNights) S.calMsg = "This home has a " + p.minNights + "-night minimum stay. Pick a check-out on or after " + fmtDate(addDays(s.ci, p.minNights)) + "."; }
      const y = window.scrollY; render(); window.scrollTo(0, y); return;
    }
    if (d.hday) {
      const p = prop(S.hostCalProp && S.props.find(x => x.id === S.hostCalProp && x.host === S.user.id) ? S.hostCalProp : S.props.find(x => x.host === S.user.id).id);
      const bi = S.blocks.findIndex(b => b.propId === p.id && d.hday >= b.start && d.hday < b.end);
      if (bi >= 0) { const b = S.blocks[bi]; S.blocks.splice(bi, 1); if (b.start < d.hday) S.blocks.push({ id: "b" + Date.now(), propId: p.id, start: b.start, end: d.hday }); if (addDays(d.hday, 1) < b.end) S.blocks.push({ id: "b" + Date.now() + 1, propId: p.id, start: addDays(d.hday, 1), end: b.end }); toast(fmtDate(d.hday) + " is open for booking"); }
      else { S.blocks.push({ id: "b" + Date.now(), propId: p.id, start: d.hday, end: addDays(d.hday, 1), note: "Blocked by host" }); toast(fmtDate(d.hday) + " blocked"); }
      const y = window.scrollY; render(); window.scrollTo(0, y); return;
    }
    if (d.cal) {
      const inHost = S.view === "host", cur = (inHost ? S.hostCalMonth : S.calMonth) || TODAY.slice(0, 7);
      let [y, m] = cur.split("-").map(Number); m += +d.cal; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
      const v = y + "-" + pad(m); if (inHost) S.hostCalMonth = v; else S.calMonth = v;
      const sy = window.scrollY; render(); window.scrollTo(0, sy); return;
    }
    if (d.gallery) { openGallery(prop(S.params.id), +d.gallery); return; }
    if (d.filter) { S.filters[d.filter] = +d.val; render(); return; }
    if (d.tab) { const [area, k] = d.tab.split(":"); S.tab[area] = k; S.editProp = null; render(); return; }
    if (d.edit) { S.editProp = d.edit; render(); return; }
    if (d.hostcal) { S.hostCalProp = d.hostcal; S.tab.host = "calendar"; render(); return; }
    if (d.approve) { const r = S.reservations.find(x => x.code === d.approve); if (prop(r.propId).host !== S.user.id) return; r.status = "confirmed"; toast("Booking " + r.code + " accepted. The guest has been notified."); render(); return; }
    if (d.decline) { const r = S.reservations.find(x => x.code === d.decline); if (prop(r.propId).host !== S.user.id) return; r.status = "declined"; toast("Request declined. The guest's card was not charged."); render(); return; }
    if (d.cancel) {
      const r = S.reservations.find(x => x.code === d.cancel);
      if (t.dataset.confirming !== "1") { t.dataset.confirming = "1"; t.textContent = "Tap again to cancel"; setTimeout(() => { if (t.isConnected) { t.dataset.confirming = ""; t.textContent = "Cancel"; } }, 4000); return; }
      r.status = "cancelled"; toast("Booking " + r.code + " cancelled. The dates are open again."); render(); return;
    }
    if (d.toggle) { const p = prop(d.toggle); p.active = !p.active; toast(p.name + (p.active ? " is live" : " is hidden from guests")); render(); return; }
    if (d.resolve) { S.issues[+d.resolve].status = "Resolved"; toast("Marked as resolved"); render(); return; }
    switch (d.act) {
      case "g-dec": S.search.guests = Math.max(1, S.search.guests - 1); syncSearchInputs(); break;
      case "g-inc": S.search.guests = Math.min(16, S.search.guests + 1); syncSearchInputs(); break;
      case "bg-dec": S.sel.guests = Math.max(1, S.sel.guests - 1); rerenderKeepScroll(); break;
      case "bg-inc": S.sel.guests = Math.min(prop(S.params.id).guests, S.sel.guests + 1); rerenderKeepScroll(); break;
      case "clear-filters": S.filters = { price: 0, bedrooms: 0, baths: 0, amen: [], instantOnly: false }; render(); break;
      case "clear-dates": S.search.ci = S.search.co = ""; render(); break;
      case "clear-sel": S.sel.ci = S.sel.co = ""; S.calMsg = ""; rerenderKeepScroll(); break;
      case "to-cal": { const a = document.getElementById("avail"); if (a) a.scrollIntoView({ behavior: "smooth", block: "start" }); break; }
      case "book": startCheckout(prop(S.params.id)); break;
      case "step0": S.checkout.step = 0; render(); break;
      case "rehold": { const c = S.checkout; releaseHold(); S.sel = { ci: c.ci, co: c.co, guests: c.guests }; S.checkout = null; startCheckout(prop(c.propId)); break; }
      case "signin-inline": go("signin", { next: "checkout-resume" }); break;
      case "signout": S.user = null; S.editProp = null; toast("You've signed out"); go("home"); break;
      case "edit-close": S.editProp = null; render(); break;
    }
  });
  function rerenderKeepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); }
  function syncSearchInputs() {
    // Keep typed values when changing the guest count.
    S.search.loc = val("s-loc"); const ci = val("s-ci"), co = val("s-co"); S.search.ci = ci; S.search.co = co;
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }

  render();
})();
</script>
