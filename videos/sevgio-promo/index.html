<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #efe7d4;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-skyline"
        class="scene"
        data-composition-id="01-skyline"
        data-composition-src="compositions/frames/01-skyline.html"
        data-start="0"
        data-duration="6"
        data-track-index="0"
      ></div>

      <div
        id="el-02-bridges"
        class="scene"
        data-composition-id="02-bridges"
        data-composition-src="compositions/frames/02-bridges.html"
        data-start="5.5"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-fountain"
        class="scene"
        data-composition-id="03-fountain"
        data-composition-src="compositions/frames/03-fountain.html"
        data-start="10.5"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-ballpark"
        class="scene"
        data-composition-id="04-ballpark"
        data-composition-src="compositions/frames/04-ballpark.html"
        data-start="15.5"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-comfort"
        class="scene"
        data-composition-id="05-comfort"
        data-composition-src="compositions/frames/05-comfort.html"
        data-start="20.5"
        data-duration="5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="25"
        data-duration="5"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/sevgio-peaceful.mp3"
        data-start="0"
        data-duration="30"
        data-track-index="11"
        data-volume="0.9"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-skyline", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 5.5);
        tl.fromTo("#el-02-bridges", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 5.5);
        tl.to("#el-02-bridges", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 10.5);
        tl.fromTo("#el-03-fountain", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 10.5);
        tl.to("#el-03-fountain", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 15.5);
        tl.fromTo("#el-04-ballpark", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 15.5);
        tl.to("#el-04-ballpark", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 20.5);
        tl.fromTo("#el-05-comfort", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 20.5);
        tl.to("#el-05-comfort", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 25);
        tl.fromTo("#el-06-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 25);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
